; reTerminal E1004 AI image - PlatformIO configuration
;
; Board : Seeed Studio reTerminal E1004 (13.3" 1200x1600 6-color Spectra 6
;         ePaper, ESP32-S3 with OPI PSRAM). See spec.md for the full spec.
;
; Logs  : carrier USB-UART bridge, GPIO43(TX)/GPIO44(RX), 115200 baud.
[env:reterminal_e1004]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino

; OPI PSRAM is mandatory: the display driver needs a ~937 kB framebuffer and
; the image pipeline allocates several MB of PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_8MB.csv
monitor_speed = 115200

build_flags =
    -D BOARD_HAS_PSRAM
    -D BOARD_SCREEN_COMBO=523          ; Seeed_GFX: reTerminal E1004 (T133A01)
    -D PNG_MAX_BUFFERED_PIXELS=16384   ; PNGdec line buffer: 2 lines x (1536*4 RGBA + filter) + alignment

lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git   ; TFT_eSPI fork + EPaper (>= 2.0.3)
    bblanchon/ArduinoJson@^7.4.2
    bitbank2/PNGdec@^1.1.6
